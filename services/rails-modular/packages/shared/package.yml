# shared — 全パッケージが継承する Rails の基底クラス。
#
# ApplicationRecord / ApplicationJob はフレームワークの構造上、
# すべてのパッケージが継承せざるを得ない。
#
# これらをルートパッケージ（app/）に置くと、各パッケージが
# ルートへの依存を宣言することになり、「パッケージは互いに独立」という
# 建て付けが崩れる（ルート経由で何でも触れてしまう）。
#
# **基底クラスだけを持つ薄いパッケージ**に切り出し、
# ここへの依存だけを許すことで、依存の意味を「継承」に限定する。
enforce_dependencies: true
enforce_privacy: false  # 基底クラスは継承のために公開する必要がある

dependencies: []
