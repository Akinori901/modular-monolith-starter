# パッケージ境界の検証。
#
# ここが落ちたらデプロイへ進まない。
# 規約を文章で配るだけでは守られないため、CI で落ちる形にしてある。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rails:
    name: Rails (パッケージ境界の検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rails-modular

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_NAME: app_test
      DB_USERNAME: app
      DB_PASSWORD: app

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: services/rails-modular

      # ── ここが本丸 ──
      # RuboCop も Brakeman も「パッケージ境界」は見ない。
      # 「Controller が他パッケージの内部実装を触っていないか」は
      # 専用のツールが要る。
      - name: 設定の妥当性を検証（packwerk validate）
        run: bin/packwerk validate

      - name: パッケージ境界を検証（packwerk check）
        run: bin/packwerk check

      - name: 静的解析（RuboCop）
        run: bin/rubocop

      - name: セキュリティ（Brakeman）
        run: bin/brakeman --no-pager -q

      - name: DB 準備
        run: bin/rails db:create db:schema:load

      - name: テスト（RSpec）
        run: bundle exec rspec

  cakephp:
    name: CakePHP (モジュール境界の検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cakephp-modular
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # CakePHP は ext-intl を必須とする（無いと composer が解決に失敗する）
          extensions: intl, pdo_pgsql, zip, bcmath
          coverage: none

      - name: 依存インストール
        run: composer install --no-interaction --prefer-dist

      # PHPStan は型を見るが、モジュールの境界は見ない。
      # 「他モジュールの内部実装を触っていないか」は deptrac の仕事。
      - name: モジュール境界を検証（deptrac）
        run: ./vendor/bin/deptrac analyse --config-file=depfile.yaml

      - name: 静的解析（PHPStan）
        run: ./vendor/bin/phpstan analyse --no-progress || true

  phoenix:
    name: Phoenix (Context 境界の検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/phoenix-context

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_phoenix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      MIX_ENV: test
      DB_HOST: localhost
      DB_NAME: app_phoenix_test
      DB_USERNAME: app
      DB_PASSWORD: app

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: 依存のキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            services/phoenix-context/deps
            services/phoenix-context/_build
          key: mix-${{ runner.os }}-${{ hashFiles('services/phoenix-context/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: 依存インストール
        run: mix deps.get

      # ── ここが本丸 ──
      # Credo も ExUnit も「Context 境界」は見ない。
      # 「Web 層が Context の内部モジュールを触っていないか」は
      # 専用のツールが要る。
      #
      # boundary はコンパイラとして動くため、境界違反はコンパイル警告に出る。
      # --warnings-as-errors を付けて初めて CI が落ちる形になる。
      # **これを外すと検証が丸ごと素通りする。**
      - name: Context 境界を検証（boundary）
        run: mix compile --force --warnings-as-errors

      - name: 未使用の依存が無いこと
        run: mix deps.unlock --check-unused

      - name: フォーマット
        run: mix format --check-formatted

      - name: 静的解析（Credo）
        run: mix credo

      - name: DB 準備
        run: mix ecto.create && mix ecto.migrate

      - name: テスト（ExUnit）
        run: mix test
